<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Mingle | Find your Extraterrestrial Soul Mate</title>
    <style>
        :root { --alien-green: #00ffcc; --space-black: #05070a; }
        
        body, html { 
            margin: 0; padding: 0; min-height: 100%; 
            background: var(--space-black); 
            color: var(--alien-green); 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Moving Stars Background */
        .stars { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: transparent url('https://www.transparenttextures.com') repeat; 
            animation: moveStars 120s linear infinite; z-index: -1; 
        }
        @keyframes moveStars { 
            from { background-position: 0 0; } 
            to { background-position: 10000px 5000px; } 
        }

        .container { 
            text-align: center; 
            background: rgba(10, 15, 25, 0.92); 
            padding: 40px 20px; 
            border-radius: 20px; 
            border: 1px solid var(--alien-green); 
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.3); 
            max-width: 650px; 
            width: 90%;
            margin: 20px;
            z-index: 1; 
        }
        
        /* Pulsing Green Heart */
        .heart { 
            width: 70px; height: 70px; 
            fill: var(--alien-green); 
            filter: drop-shadow(0 0 12px var(--alien-green)); 
            animation: pulse 2s ease-in-out infinite; 
            margin-bottom: 15px; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        h1 { font-size: 2.2rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 3px; }
        p { color: #a0aec0; margin-bottom: 35px; font-size: 1.1rem; }
        
        /* Form Wrapper */
        .form-wrapper { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            background: white; /* Google Forms look best on white, or match your form theme */
        }
        iframe { border: none; width: 100%; height: 700px; display: block; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <svg class="heart" viewBox="0 0 32 32">
            <path d="M16 28.5L4.5 17c-2.5-2.5-2.5-6.5 0-9s6.5-2.5 9 0l2.5 2.5 2.5-2.5c2.5-2.5 6.5-2.5 9 0s2.5 6.5 0 9L16 28.5z"/>
        </svg>
        
        <h1>Find your Extraterrestrial Soul Mate Soon...</h1>
        <p>The universe is vast. Why spend it alone?</p>
        
        <div class="form-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeMBM50MFCZ3TXsnhmU1bOVgL9uG0Hq6SE2YhLJGjJxrRnUMQ/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>
</body>
</html>
